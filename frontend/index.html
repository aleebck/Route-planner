<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Route Finder</title>

        <link rel="stylesheet" href="style.css">
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
    </head>
    <body>

        <main class="app">
            <header class="top-header">
                <div>
                    <h1>TEXAS ROUTE PLANNER</h1>
                    <p>Find the shortest route between Texas cities</p>
                </div>

                <div class="algorithm-badge">
                    C++ • DIJKSTRA
                </div>
            </header>

            <div class="main-container">
                <section class="left-section">
                    
                    <div class="planner">
                        <div class="planner-title">
                            <h2>Plan Your Route</h2>
                            <p>Select your starting point and destination</p>
                        </div>

                        <div class="location-input">
                            <label for="from-city">From</label>

                            <select id="from-city">
                                <option value="">Select a city</option>
                            </select>
                        </div>

                        <div class="location-input">
                            <label for="to-city">To</label>

                            <select id="to-city">
                                <option value="">Select a city</option>
                            </select>
                        </div>

                        <button class="find-route-button">
                            <span>⌁</span>
                            <span>Find Route</span>
                            <span class="button-arrow">→</span>
                        </button>

                    </div>

                    <div class="route-result">
                        <h3>Route Details</h3>

                        <div class="all-roads"></div>
                        <div class="route-found"></div>
                    </div>

                </section>

                <section class="right-section">
                    <div id="map"></div>
                </section>

            </div>

        </main>


        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="data.js"></script>
        <script src="script.js"></script>

    </body>
</html>
